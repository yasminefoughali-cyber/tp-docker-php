services:
  # C2 : serveur de base de donnees
  mysql_container:
    image: mysql:8.0
    container_name: mysql_container
    environment:
      MYSQL_DATABASE: test
      MYSQL_ROOT_PASSWORD: test
      MYSQL_USER: test
      MYSQL_PASSWORD: test
    volumes:
      - db-volume:/var/lib/mysql
      - ./articles.sql:/docker-entrypoint-initdb.d/articles.sql:ro

  # C1 : serveur web Apache + PHP
  web:
    build: .
    container_name: myweb_container
    depends_on:
      - mysql_container
    ports:
      - "8080:80"

volumes:
  db-volume:
    name: db-volume

